          )
          replace_once(
              'README.md',
              '''- **米游社备用短信登录**：[MiyoQian](https://github.com/Marchen-orz/MiyoQian) 的 Android 短信验证码、RSA、AIGIS 和 token 交换流程。
          ''',
              '',
          )

          # Make sure no product code or docs still advertise the removed login path.
          for root in ['app/src/main', 'app/src/test', 'README.md']:
              p = Path(root)
              files = [p] if p.is_file() else list(p.rglob('*'))
              for file in files:
                  if file.is_file() and file.suffix in {'.kt', '.xml', '.md'}:
                      text = file.read_text(encoding='utf-8')
                      if 'MihoyoCaptcha' in text or '短信验证码' in text or 'AIGIS' in text:
                          raise SystemExit(f'removed login reference remains in {file}')

          # Self-delete so the successful code commit does not leave a maintenance workflow behind.
          Path('.github/workflows/apply-manual-completion-fix.yml').unlink()
          PY

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'FeiGePro'
          git config user.email '94056084+FeiGePro@users.noreply.github.com'
          git add -A
          git commit -m 'fix: share manual completion with scheduled check-in'
          git push origin HEAD:${{ github.head_ref }}
