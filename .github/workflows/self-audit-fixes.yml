              )
              _state.value = _state.value.copy(
                  sklandLoggedIn = true,
                  output = listOf("${nowLabel()} 森空岛登录与会话凭证已加密保存"),
              )
          }

              fun saveSklandToken(token: String) {
              if (token.isBlank()) return
              val existing = repository.loadSkland(DEFAULT_ACCOUNT)
              val completeExistingSession = existing?.accessToken == token &&
                  !existing.cred.isNullOrBlank() &&
                  !existing.signToken.isNullOrBlank()
              if (!completeExistingSession) repository.saveSklandToken(DEFAULT_ACCOUNT, token)
              _state.value = _state.value.copy(
                  sklandLoggedIn = true,
                  output = listOf("${nowLabel()} 森空岛登录与会话凭证已加密保存"),
              )
          }

          '''.replace('              ', '')
          replace_once(vm, dead_skland_methods, '')
          replace_once(vm,
              '    fun runSelectedCheckIns() {\n        if (_state.value.busy) return\n',
              '    fun runSelectedCheckIns() {\n        if (_state.value.busy || _state.value.qrSession != null || _state.value.sklandQrSession != null) return\n')

          # SMS login becomes an internal Activity that returns to the existing main screen.
          sms = 'app/src/main/java/io/github/feigepro/checkintrace/MihoyoCaptchaLoginActivity.kt'
          replace_once(sms, 'import android.content.Intent\n', '')
          replace_once(sms,
              '''                        repository.saveMihoyo(DEFAULT_ACCOUNT, credential)
                          setResult(RESULT_OK)
                          startActivity(
                              Intent(this, MainActivity::class.java)
                                  .addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                          )
                          finish()
              '''.replace('              ', ''),
              '''                        repository.saveMihoyo(DEFAULT_ACCOUNT, credential)
                          setResult(RESULT_OK)
                          finish()
              '''.replace('              ', ''))

          # Use the official scanUrl returned by Hypergryph and stop hiding API errors as "waiting".
          skland_qr = Path('app/src/main/java/io/github/feigepro/checkintrace/provider/skland/SklandQrLoginClient.kt')
          skland_qr.write_text('''package io.github.feigepro.checkintrace.provider.skland

          import io.github.feigepro.checkintrace.logging.DevLogger
          import java.util.concurrent.TimeUnit
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.builtins.serializer
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.json.JsonObject
          import kotlinx.serialization.json.jsonObject
          import kotlinx.serialization.json.jsonPrimitive
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody

          data class SklandQrSession(
              val scanId: String,
              val qrContent: String,
          )

          sealed interface SklandQrPollResult {
              data object Waiting : SklandQrPollResult
              data class Confirmed(val token: String) : SklandQrPollResult
          }

          class SklandQrLoginClient(
              private val client: OkHttpClient = defaultClient(),
              private val json: Json = Json { ignoreUnknownKeys = true },
          ) {
              suspend fun create(taskId: String? = null): Result<SklandQrSession> = withContext(Dispatchers.IO) {
                  runCatching {
                      val root = postJson(GENERATE_URL, "{\\"appCode\\":\\"$APP_CODE\\"}")
                      requireSuccess(root, "获取登录二维码失败")
                      val data = root["data"]?.jsonObject ?: error("二维码接口未返回 data")
                      val scanId = data["scanId"]?.jsonPrimitive?.content.orEmpty()
                      val scanUrl = data["scanUrl"]?.jsonPrimitive?.content.orEmpty()
                      check(scanId.isNotBlank()) { "二维码接口未返回 scanId" }
                      val content = scanUrl.ifBlank { "hypergryph://scan_login?scanId=$scanId" }
                      DevLogger.info("森空岛/登录", "二维码创建成功", taskId)
                      SklandQrSession(scanId, content)
                  }.onFailure { DevLogger.error("森空岛/登录", it.message ?: "二维码创建失败", taskId) }
              }

              suspend fun poll(session: SklandQrSession, taskId: String? = null): Result<SklandQrPollResult> =
                  withContext(Dispatchers.IO) {
                      runCatching {
                          val url = okhttp3.HttpUrl.Builder()
                              .scheme("https")
                              .host("as.hypergryph.com")
                              .addPathSegments("general/v1/scan_status")
                              .addQueryParameter("scanId", session.scanId)
                              .build()
                          val root = executeJson(Request.Builder().url(url).get().build())
                          requireSuccess(root, "查询二维码状态失败")
                          val scanCode = root["data"]?.jsonObject?.get("scanCode")?.jsonPrimitive?.content.orEmpty()
                          if (scanCode.isBlank()) return@runCatching SklandQrPollResult.Waiting
                          DevLogger.info("森空岛/登录", "扫码确认成功，开始交换登录凭证", taskId)
                          val tokenRoot = postJson(TOKEN_URL, "{\\"scanCode\\":${jsonString(scanCode)}}")
                          requireSuccess(tokenRoot, "扫码登录凭证交换失败")
                          val token = tokenRoot["data"]?.jsonObject?.get("token")?.jsonPrimitive?.content.orEmpty()
                          check(token.isNotBlank()) { "扫码登录凭证交换结果缺少 token" }
                          SklandQrPollResult.Confirmed(token)
                      }.onFailure { DevLogger.error("森空岛/登录", it.message ?: "轮询失败", taskId) }
                  }

              private fun postJson(url: String, body: String): JsonObject = executeJson(
                  Request.Builder().url(url).post(body.toRequestBody(JSON_MEDIA_TYPE)).build(),
              )

              private fun executeJson(request: Request): JsonObject = client.newCall(request).execute().use { response ->
                  val raw = response.body?.string().orEmpty()
                  check(response.isSuccessful) { "HTTP ${response.code}" }
                  check(raw.isNotBlank()) { "接口返回空内容" }
                  json.parseToJsonElement(raw).jsonObject
              }

              private fun requireSuccess(root: JsonObject, prefix: String) {
                  val status = root["status"]?.jsonPrimitive?.content?.toIntOrNull()
                  check(status == 0) {
                      "$prefix：${root["msg"]?.jsonPrimitive?.content ?: root["message"]?.jsonPrimitive?.content ?: "未知错误"}"
                  }
              }

              private fun jsonString(value: String): String = json.encodeToString(String.serializer(), value)

              companion object {
                  private const val APP_CODE = "4ca99fa6b56cc2ba"
                  private const val GENERATE_URL = "https://as.hypergryph.com/general/v1/gen_scan/login"
                  private const val TOKEN_URL = "https://as.hypergryph.com/user/auth/v1/token_by_scan_code"
                  private val JSON_MEDIA_TYPE = "application/json; charset=utf-8".toMediaType()

                  private fun defaultClient() = OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .writeTimeout(10, TimeUnit.SECONDS)
                      .build()
              }
          }
          '''.replace('          ', ''), encoding='utf-8')

          # Persist roles whose POST may already have started, including process-death recovery.
          status_file = 'app/src/main/java/io/github/feigepro/checkintrace/AutoCheckInStatus.kt'
          replace_once(status_file,
              '    val completedRoleKeys: Set<String> = emptySet(),\n)',
              '    val completedRoleKeys: Set<String> = emptySet(),\n    val submittedRoleKeys: Set<String> = emptySet(),\n)')

          worker = 'app/src/main/java/io/github/feigepro/checkintrace/AutoCheckInWorker.kt'
          replace_once(worker,
              '''        val completedRoleKeys = if (
                  runAttemptCount > 0 && previousSnapshot?.state == AutoCheckInRunState.RETRY_SCHEDULED
              ) {
                  previousSnapshot.completedRoleKeys.toMutableSet()
              } else {
                  mutableSetOf()
              }
          '''.replace('          ', ''),
              '''        val shouldRestoreProgress = runAttemptCount > 0 && previousSnapshot?.state in setOf(
                  AutoCheckInRunState.RUNNING,
                  AutoCheckInRunState.RETRY_SCHEDULED,
              )
              val completedRoleKeys = if (shouldRestoreProgress) {
                  previousSnapshot?.completedRoleKeys.orEmpty().toMutableSet()
              } else {
