name: Cleanup merged branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/localize-log-timestamps"
            "release/0.2.2-signed"
            "chore/codespaces-signing-setup"
            "docs/readme-refresh"
            "ops/delete-merged-branches"
            "noop"
            "tmp-ignore"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Branch still exists: $branch" >&2
              exit 1
            fi
          done
