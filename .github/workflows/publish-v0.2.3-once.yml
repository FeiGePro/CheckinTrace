name: Publish v0.2.3 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'ops: publish v0.2.3 once')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.2.3
      CHECKINTRACE_SIGN_RELEASE: "true"
      CHECKINTRACE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CHECKINTRACE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CHECKINTRACE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate app version
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          test "$RELEASE_TAG" = "v$VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$CHECKINTRACE_KEYSTORE_PASSWORD"
          test -n "$CHECKINTRACE_KEY_ALIAS"
          test -n "$CHECKINTRACE_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/checkintrace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "CHECKINTRACE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build signed Release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p release
          APK="release/CheckinTrace-${RELEASE_TAG}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/CheckinTrace-${RELEASE_TAG}-android.apk"
          HASH="${APK}.sha256"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$HASH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$HASH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file <(sed -n '/^## 0.2.3$/,/^## 0.2.2$/p' CHANGELOG.md | sed '$d') \
              --latest
          fi
