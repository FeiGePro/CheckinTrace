name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Skland three-phase flow fix
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reliability-login-observability'
        run: python ci/apply_skland_403_flow_fix.py

      - name: Prepare stable Debug signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/checkintrace-signing"
          mkdir -p "$signing_dir"
          keystore_path="$signing_dir/checkintrace-debug.keystore"
          base64 --decode ci/checkintrace-debug.keystore.b64 > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "CHECKINTRACE_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "CHECKINTRACE_DEBUG_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CHECKINTRACE_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "CHECKINTRACE_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Test and build Debug and Release APKs
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Verify stable Debug certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee debug-certificate.log
          grep -F "certificate SHA-256 digest: 49af905ddfdacc4f816a939c716fc707a4f22811a9954a659a60055dfc90cd47" debug-certificate.log

      - name: Commit verified Skland changes
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reliability-login-observability'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/src/main/java/io/github/feigepro/checkintrace/provider/skland/SklandApi.kt \
            app/src/main/java/io/github/feigepro/checkintrace/provider/skland/SklandProvider.kt \
            app/src/main/java/io/github/feigepro/checkintrace/MainViewModel.kt \
            app/src/main/java/io/github/feigepro/checkintrace/AutoCheckInWorker.kt \
            app/src/test/java/io/github/feigepro/checkintrace/provider/skland/SklandApiAuthTest.kt
          if git diff --cached --quiet; then
            echo "Skland changes already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden Skland session and attendance flow"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CheckinTrace-build-log
          path: |
            build.log
            debug-certificate.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckinTrace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
