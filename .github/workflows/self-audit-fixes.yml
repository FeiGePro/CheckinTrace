              '                    qrStatus = "已扫码，请在米游社中确认。该通道不等同于 Android 短信登录。",\n')
          dead_skland_methods = '''    fun saveSklandCredential(
              accessToken: String,
              cred: String?,
              signToken: String?,
              userId: String?,
          ) {
              if (accessToken.isBlank()) return
              repository.saveSkland(
                  DEFAULT_ACCOUNT,
