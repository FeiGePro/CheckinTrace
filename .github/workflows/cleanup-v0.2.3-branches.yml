name: Cleanup v0.2.3 branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete merged temporary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "release/0.2.3-reliability"
            "ops/publish-v0.2.3"
            "ops/trigger-v0.2.3-release"
            "ops/cleanup-v0.2.3-branches"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Branch still exists: $branch" >&2
              exit 1
            fi
          done
