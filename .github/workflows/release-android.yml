name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.6
        required: true
        default: v0.2.6
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      CHECKINTRACE_SIGN_RELEASE: "true"
      CHECKINTRACE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CHECKINTRACE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CHECKINTRACE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          EXPECTED_TAG="v$VERSION_NAME"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match app version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$CHECKINTRACE_KEYSTORE_PASSWORD"
          test -n "$CHECKINTRACE_KEY_ALIAS"
          test -n "$CHECKINTRACE_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/checkintrace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "CHECKINTRACE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build signed Release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify release APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/CheckinTrace-${RELEASE_TAG}-android.apk"
          sha256sum "release/CheckinTrace-${RELEASE_TAG}-android.apk" > "release/CheckinTrace-${RELEASE_TAG}-android.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckinTrace-${{ env.RELEASE_TAG }}-signed
          path: |
            release/CheckinTrace-${{ env.RELEASE_TAG }}-android.apk
            release/CheckinTrace-${{ env.RELEASE_TAG }}-android.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/CheckinTrace-${RELEASE_TAG}-android.apk"
          HASH="${APK}.sha256"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$HASH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$HASH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
