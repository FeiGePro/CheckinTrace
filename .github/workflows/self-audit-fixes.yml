name: Apply self-audit fixes

on:
  push:
    branches:
      - feat/reliability-login-observability
    paths:
      - .github/workflows/self-audit-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reliability-login-observability
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          branch_root = Path('.')

          # Remove duplicate launcher icon and obsolete Skland login Activity declaration.
          manifest = Path('app/src/main/AndroidManifest.xml')
          manifest.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CheckinTrace"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MihoyoCaptchaLoginActivity"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''.replace('          ', ''), encoding='utf-8')

          # Main screen: Android SMS is primary; QR is an explicitly labelled compatibility option.
          main_activity = 'app/src/main/java/io/github/feigepro/checkintrace/MainActivity.kt'
          replace_once(main_activity,
              'import android.Manifest\nimport android.app.TimePickerDialog\nimport android.content.pm.PackageManager\n',
              'import android.Manifest\nimport android.app.Activity\nimport android.app.TimePickerDialog\nimport android.content.Intent\nimport android.content.pm.PackageManager\n')
          replace_once(main_activity,
              'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\n',
              'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\nimport androidx.activity.result.contract.ActivityResultContracts\n')
          replace_once(main_activity,
              '    val context = LocalContext.current\n    var showAvailable by rememberSaveable { mutableStateOf(false) }\n',
              '''    val context = LocalContext.current
              val mihoyoSmsLogin = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult(),
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) model.refreshLoginStates()
              }
              var showAvailable by rememberSaveable { mutableStateOf(false) }
