                      state.mihoyoLoggedIn,
                      state.sklandLoggedIn,
                      loginEnabled,
                      model::beginMihoyoLogin,
                      model::beginSklandLogin,
                  )
              '''.replace('              ', ''),
              '''                AccountPanel(
                      mihoyoLoggedIn = state.mihoyoLoggedIn,
                      sklandLoggedIn = state.sklandLoggedIn,
                      enabled = loginEnabled,
