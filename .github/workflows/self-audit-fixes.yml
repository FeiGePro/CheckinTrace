                              lines += timestamped("$label：已在上次尝试完成，本次跳过")
                              continue
                          }

                          requestPacer.awaitTurn()
                          lines += timestamped("$label：开始请求")
                          saveProgress(statusStore, startedAt, scheduledTimeLabel, attempt, lines, completedRoleKeys)
              '''.replace('              ', ''),
              '''                        if (runAttemptCount > 0 && (roleKey in completedRoleKeys || roleKey in submittedRoleKeys)) {
                              val reason = if (roleKey in completedRoleKeys) {
                                  "已在上次尝试完成"
                              } else {
                                  "上次尝试已开始提交但结果未知"
                              }
                              lines += timestamped("$label：$reason，本次跳过")
                              continue
                          }

                          requestPacer.awaitTurn()
                          submittedRoleKeys += roleKey
                          lines += timestamped("$label：开始请求")
                          saveProgress(
                              statusStore,
                              startedAt,
                              scheduledTimeLabel,
                              attempt,
                              lines,
                              completedRoleKeys,
                              submittedRoleKeys,
                          )
              '''.replace('              ', ''))
          replace_once(worker,
              '                                if (result.retryable) hasRetryableFailure = true\n',
              '''                                if (result.retryable) {
                                      submittedRoleKeys -= roleKey
                                      hasRetryableFailure = true
                                  }
              '''.replace('              ', ''))
          replace_once(worker,
              '                        saveProgress(statusStore, startedAt, scheduledTimeLabel, attempt, lines, completedRoleKeys)\n',
              '''                        saveProgress(
                              statusStore,
                              startedAt,
                              scheduledTimeLabel,
                              attempt,
                              lines,
                              completedRoleKeys,
                              submittedRoleKeys,
                          )
              '''.replace('              ', ''))
          replace_once(worker,
              '                completedRoleKeys = completedRoleKeys,\n            )\n            statusStore.save(snapshot)\n',
              '                completedRoleKeys = completedRoleKeys,\n                submittedRoleKeys = submittedRoleKeys,\n            )\n            statusStore.save(snapshot)\n')
          replace_once(worker,
              '                completedRoleKeys = completedRoleKeys,\n            )\n            runCatching { statusStore.save(snapshot) }\n',
              '                completedRoleKeys = completedRoleKeys,\n                submittedRoleKeys = submittedRoleKeys,\n            )\n            runCatching { statusStore.save(snapshot) }\n')
          replace_once(worker,
              '''        lines: List<String>,
              completedRoleKeys: Set<String>,
          ) {
          '''.replace('          ', ''),
              '''        lines: List<String>,
              completedRoleKeys: Set<String>,
              submittedRoleKeys: Set<String>,
          ) {
          '''.replace('          ', ''))
          replace_once(worker,
              '                completedRoleKeys = completedRoleKeys.toSet(),\n            ),\n',
              '                completedRoleKeys = completedRoleKeys.toSet(),\n                submittedRoleKeys = submittedRoleKeys.toSet(),\n            ),\n')
          replace_once(worker,
              '已完成或结果未知的角色不会重复请求',
              '已完成、结果未知或已开始提交的角色不会重复请求')
          replace_once(worker,
              '已完成或结果未知的角色不会重复请求',
              '已完成、结果未知或已开始提交的角色不会重复请求')

          # Remove obsolete Activity now that QR is rendered in MainActivity.
          obsolete = Path('app/src/main/java/io/github/feigepro/checkintrace/SklandLoginActivity.kt')
          if obsolete.exists():
