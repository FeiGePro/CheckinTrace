import android.content.Context
import java.time.LocalDate

internal data class DailyCheckInProgress(
    val date: String,
    val completedGameIds: Set<String> = emptySet(),
    val completedRoleKeys: Set<String> = emptySet(),
    val submittedRoleKeys: Set<String> = emptySet(),
) {
    fun normalizedFor(today: String): DailyCheckInProgress =
        if (date == today) this else DailyCheckInProgress(date = today)
}

/**
 * Stores only today's idempotency state. A new local calendar date automatically starts with an empty record.
 * Manual and WorkManager runs share this store so a successful manual run prevents the scheduled run from
 * repeating the same game or converting a later transient read error into a retry.
 */
internal class DailyCheckInProgressStore(context: Context) {
    private val preferences = context.getSharedPreferences(PREFERENCES_NAME, Context.MODE_PRIVATE)

    @Synchronized
    fun loadToday(today: LocalDate = LocalDate.now()): DailyCheckInProgress {
        val date = today.toString()
        return DailyCheckInProgress(
            date = preferences.getString(KEY_DATE, null).orEmpty(),
            completedGameIds = preferences.getStringSet(KEY_COMPLETED_GAMES, emptySet()).orEmpty().toSet(),
            completedRoleKeys = preferences.getStringSet(KEY_COMPLETED_ROLES, emptySet()).orEmpty().toSet(),
            submittedRoleKeys = preferences.getStringSet(KEY_SUBMITTED_ROLES, emptySet()).orEmpty().toSet(),
        ).normalizedFor(date)
    }

    @Synchronized
    fun markGameCompleted(gameId: String) = mutate { progress ->
        progress.copy(completedGameIds = progress.completedGameIds + gameId)
    }

    @Synchronized
    fun markRoleSubmitted(roleKey: String) = mutate { progress ->
        progress.copy(submittedRoleKeys = progress.submittedRoleKeys + roleKey)
    }

    @Synchronized
    fun markRoleCompleted(roleKey: String) = mutate { progress ->
        progress.copy(
            completedRoleKeys = progress.completedRoleKeys + roleKey,
            submittedRoleKeys = progress.submittedRoleKeys + roleKey,
        )
    }

    @Synchronized
    fun removeRoleSubmitted(roleKey: String) = mutate { progress ->
        progress.copy(submittedRoleKeys = progress.submittedRoleKeys - roleKey)
    }

    private fun mutate(block: (DailyCheckInProgress) -> DailyCheckInProgress) {
        save(block(loadToday()))
    }

    private fun save(progress: DailyCheckInProgress) {
        check(
            preferences.edit()
                .putString(KEY_DATE, progress.date)
                .putStringSet(KEY_COMPLETED_GAMES, progress.completedGameIds.toSet())
                .putStringSet(KEY_COMPLETED_ROLES, progress.completedRoleKeys.toSet())
                .putStringSet(KEY_SUBMITTED_ROLES, progress.submittedRoleKeys.toSet())
                .commit(),
        ) { "无法保存今日签到进度" }
    }

    private companion object {
        const val PREFERENCES_NAME = "daily_checkin_progress"
        const val KEY_DATE = "date"
        const val KEY_COMPLETED_GAMES = "completed_games"
        const val KEY_COMPLETED_ROLES = "completed_roles"
        const val KEY_SUBMITTED_ROLES = "submitted_roles"
    }
}
''', encoding='utf-8')

