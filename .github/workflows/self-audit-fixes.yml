                      onMihoyoQrLogin = model::beginMihoyoQrLogin,
                      onSklandLogin = model::beginSklandLogin,
                  )
              '''.replace('              ', ''))
          replace_once(main_activity,
              '                    enabled = !state.busy && state.selected.isNotEmpty(),\n',
              '                    enabled = loginEnabled && state.selected.isNotEmpty(),\n')
          old_account_panel = '''@Composable
          private fun AccountPanel(
