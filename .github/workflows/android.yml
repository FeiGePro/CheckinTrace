name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply focused source patch
        run: python .github/scripts/apply_manual_completion_fix.py

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Test and build Debug and Release APKs
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "FeiGePro"
          git config user.email "94056084+FeiGePro@users.noreply.github.com"
          git add README.md app
          git commit -m "fix: share manual completion with scheduled check-in"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CheckinTrace-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CheckinTrace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
