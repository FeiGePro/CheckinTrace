          # Serialization regression coverage for process-death protection.
          Path('app/src/test/java/io/github/feigepro/checkintrace/AutoCheckInSnapshotTest.kt').write_text('''package io.github.feigepro.checkintrace

          import kotlinx.serialization.decodeFromString
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class AutoCheckInSnapshotTest {
              private val json = Json { ignoreUnknownKeys = true }

              @Test
              fun `submitted role keys survive serialization`() {
                  val snapshot = AutoCheckInSnapshot(
                      state = AutoCheckInRunState.RUNNING,
                      startedAtEpochMillis = 1L,
                      completedRoleKeys = setOf("done"),
                      submittedRoleKeys = setOf("done", "possibly-sent"),
                  )

                  val decoded = json.decodeFromString<AutoCheckInSnapshot>(json.encodeToString(snapshot))

                  assertEquals(snapshot, decoded)
              }

              @Test
              fun `legacy snapshots default submitted roles to empty`() {
                  val decoded = json.decodeFromString<AutoCheckInSnapshot>(
                      """{"state":"RUNNING","startedAtEpochMillis":1,"completedRoleKeys":["done"]}""",
                  )

                  assertEquals(setOf("done"), decoded.completedRoleKeys)
                  assertTrue(decoded.submittedRoleKeys.isEmpty())
              }
          }
          '''.replace('          ', ''), encoding='utf-8')
          PY

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain

      - name: Commit audited fixes
        shell: bash
        run: |
          rm .github/workflows/self-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align login UX and retry safety"
          git push origin HEAD:feat/reliability-login-observability
