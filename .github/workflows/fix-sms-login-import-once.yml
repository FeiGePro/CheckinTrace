name: Fix SMS login import once

on:
  push:
    branches: [feat/reliability-login-observability]
    paths:
      - ".github/workflows/fix-sms-login-import-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/reliability-login-observability

      - name: Remove invalid Compose import
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/io/github/feigepro/checkintrace/MihoyoCaptchaLoginActivity.kt"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$FILE"
          ! grep -q '^import androidx\.compose\.foundation\.layout\.weight$' "$FILE"
          rm .github/workflows/fix-sms-login-import-once.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/feigepro/checkintrace/MihoyoCaptchaLoginActivity.kt .github/workflows/fix-sms-login-import-once.yml
          git commit -m "fix: remove invalid Compose weight import"
          git push origin HEAD:feat/reliability-login-observability
