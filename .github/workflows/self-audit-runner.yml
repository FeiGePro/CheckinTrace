name: Run self-audit fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reliability-login-observability
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply embedded audit patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/self-audit-fixes.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          if start not in source or end not in source:
              raise RuntimeError('Unable to locate embedded audit patch')
          embedded = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(embedded), 'self-audit-fixes.py', 'exec'))
          PY

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --console=plain

      - name: Commit audited fixes
        shell: bash
        run: |
          rm .github/workflows/self-audit-fixes.yml
          rm .github/workflows/self-audit-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align login UX and retry safety"
          git push origin HEAD:feat/reliability-login-observability
